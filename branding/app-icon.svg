<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1b20"/>
      <stop offset="48%" stop-color="#101013"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="whiteMark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="silverMark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4d4dc"/>
      <stop offset="100%" stop-color="#8b8b96"/>
    </linearGradient>
    <filter id="markShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="squircleClip">
      <rect x="44" y="44" width="936" height="936" rx="220" ry="220"/>
    </clipPath>
  </defs>


  <g clip-path="url(#squircleClip)">
    <rect x="44" y="44" width="936" height="936" rx="220" ry="220" fill="url(#bgGrad)"/>
    <rect x="44" y="44" width="936" height="936" rx="220" ry="220" fill="url(#topGlow)"/>
  </g>
  <rect x="48" y="48" width="928" height="928" rx="216" ry="216" fill="none" stroke="url(#rimGrad)" stroke-width="8"/>

  <g filter="url(#markShadow)" transform="translate(-8, 6)">
    <!-- Back left Antigravity arch (crisp platinum-silver, terminates cleanly behind front arch) -->
    <path d="M 192 688
             C 246 624, 290 330, 388 330
             C 454 330, 488 456, 514 554
             L 452 574
             C 430 536, 412 522, 386 522
             C 322 522, 294 646, 232 698
             C 202 722, 172 710, 192 688 Z"
          fill="url(#silverMark)"/>
    <!-- Subtle cutout separation behind front arch -->
    <path d="M 424 686
             C 490 618, 536 296, 646 296
             C 748 296, 782 544, 842 666
             C 856 694, 832 722, 804 708
             C 746 678, 722 550, 646 550
             C 568 550, 538 666, 466 708
             C 434 726, 404 708, 424 686 Z"
          fill="#0c0c0f" stroke="#0c0c0f" stroke-width="26" stroke-linejoin="round"/>
    <!-- Front right Antigravity arch (pure crisp white) -->
    <path d="M 424 686
             C 490 618, 536 296, 646 296
             C 748 296, 782 544, 842 666
             C 856 694, 832 722, 804 708
             C 746 678, 722 550, 646 550
             C 568 550, 538 666, 466 708
             C 434 726, 404 708, 424 686 Z"
          fill="url(#whiteMark)"/>
  </g>
</svg>